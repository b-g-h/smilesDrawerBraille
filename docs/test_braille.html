<!DOCTYPE html>
<html lang="de">
<head><meta charset="utf-8"><title>Test Braille</title></head>
<body>
<svg id="output"></svg>
<div id="error" style="color:red;"></div>
<script src="./js/smiles-drawer.min.js"></script>
<script>
try {
  const drawer = new SmilesDrawer.BrailleSvgDrawer({width:300,height:200});
  SmilesDrawer.parse('C1CCCCC1', function(tree) {
    try {
      const svg = drawer.draw(tree, document.getElementById('output'), 'braille');
      document.getElementById('error').textContent = 'OK: ' + svg.children.length + ' children';
    } catch(e) {
      document.getElementById('error').textContent = 'DRAW ERROR: ' + e.message;
    }
  });
} catch(e) {
  document.getElementById('error').textContent = 'PARSE ERROR: ' + e.message;
}
</script>
</body>
</html>
